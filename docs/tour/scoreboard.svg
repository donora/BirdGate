33333" y="102" class="ink2" font-size="11.5" text-anchor="start" font-weight="400">40 cascaded resonators, after CARFAC</text><text x="525.3333333333333" y="150" class="ink" font-size="34" text-anchor="start" font-weight="600">11%</text><text x="525.3333333333333" y="170" class="ink2" font-size="12" text-anchor="start" font-weight="400">of the skippable silence skipped</text><line class="line" x1="525.3333333333333" y1="196" x2="719.3333333333333" y2="196" stroke-width="1.5"/><line class="line" x1="525.3333333333333" y1="191" x2="525.3333333333333" y2="201" stroke-width="1"/><line class="line" x1="622.3333333333333" y1="191" x2="622.3333333333333" y2="201" stroke-width="1"/><line class="line" x1="719.3333333333333" y1="191" x2="719.3333333333333" y2="201" stroke-width="1"/><circle class="ink2" cx="540.8" cy="196" r="4.5" opacity="0.85"/><circle class="ink2" cx="567.4" cy="196" r="4.5" opacity="0.85"/><circle class="ink2" cx="534.9" cy="196" r="4.5" opacity="0.85"/><circle class="ink2" cx="525.3" cy="196" r="4.5" opacity="0.85"/><circle class="ink2" cx="528.4" cy="196" r="4.5" opacity="0.85"/><circle class="ink2" cx="560.3" cy="196" r="4.5" opacity="0.85"/><text x="525.3333333333333" y="216" class="ink3" font-size="11" text-anchor="start" font-weight="400">0–22% by recording</text><text x="719.3333333333333" y="216" class="ink3" font-size="11" text-anchor="end" font-weight="400">100%</text><text x="525.3333333333333" y="248" class="limitt" font-size="13" text-anchor="start" font-weight="600">1.9% of birdsong missed</text><text x="525.3333333333333" y="266" class="limitt" font-size="11.5" text-anchor="start" font-weight="400">13.9% on the worst recording</text><text x="525.3333333333333" y="290" class="ink2" font-size="12" text-anchor="start" font-weight="400">card saved</text><text x="719.3333333333333" y="290" class="ink mono" font-size="12" text-anchor="end" font-weight="600">4.3%</text><text x="525.3333333333333" y="309" class="ink2" font-size="12" text-anchor="start" font-weight="400">worst species kept</text><text x="719.3333333333333" y="309" class="ink mono" font-size="12" text-anchor="end" font-weight="600">94.1%</text><text x="525.3333333333333" y="328" class="ink2" font-size="12" text-anchor="start" font-weight="400">model size</text><text x="719.3333333333333" y="328" class="ink mono" font-size="12" text-anchor="end" font-weight="600">172 B</text><text x="525.3333333333333" y="359" class="ink2" font-size="11.5" text-anchor="start" font-weight="400">last on every metric</text><rect class="box" x="754.0" y="52" width="226" height="322" rx="12" stroke-width="1.2"/><text x="770.0" y="82" class="ink" font-size="16" text-anchor="start" font-weight="600">Tiny CNN</text><text x="770.0" y="102" class="ink2" font-size="11.5" text-anchor="start" font-weight="400">int8 convolutional net over log-mel</text><text x="770.0" y="150" class="ink" font-size="34" text-anchor="start" font-weight="600">53%</text><text x="770.0" y="170" class="ink2" font-size="12" text-anchor="start" font-weight="400">of the skippable silence skipped</text><line class="line" x1="770.0" y1="196" x2="964.0" y2="196" stroke-width="1.5"/><line class="line" x1="770.0" y1="191" x2="770.0" y2="201" stroke-width="1"/><line class="line" x1="867.0" y1="191" x2="867.0" y2="201" stroke-width="1"/><line class="line" x1="964.0" y1="191" x2="964.0" y2="201" stroke-width="1"/><circle class="ink2" cx="800.1" cy="196" r="4.5" opacity="0.85"/><circle class="ink2" cx="832.7" cy="196" r="4.5" opacity="0.85"/><circle class="ink2" cx="888.6" cy="196" r="4.5" opacity="0.85"/><circle class="ink2" cx="834.4" cy="196" r="4.5" opacity="0.85"/><circle class="ink2" cx="899.5" cy="196" r="4.5" opacity="0.85"/><circle class="ink2" cx="891.9" cy="196" r="4.5" opacity="0.85"/><text x="770.0" y="216" class="ink3" font-size="11" text-anchor="start" font-weight="400">16–67% by recording</text><text x="964.0" y="216" class="ink3" font-size="11" text-anchor="end" font-weight="400">100%</text><text x="770.0" y="248" class="limitt" font-size="13" text-anchor="start" font-weight="600">2.0% of birdsong missed</text><text x="770.0" y="266" class="limitt" font-size="11.5" text-anchor="start" font-weight="400">5.1% on the worst recording</text><text x="770.0" y="290" class="ink2" font-size="12" text-anchor="start" font-weight="400">card saved</text><text x="964.0" y="290" class="ink mono" font-size="12" text-anchor="end" font-weight="600">13.2%</text><text x="770.0" y="309" class="ink2" font-size="12" text-anchor="start" font-weight="400">worst species kept</text><text x="964.0" y="309" class="ink mono" font-size="12" text-anchor="end" font-weight="600">92.2%</text><text x="770.0" y="328" class="ink2" font-size="12" text-anchor="start" font-weight="400">model size</text><text x="964.0" y="328" class="ink mono" font-size="12" text-anchor="end" font-weight="600">5.9 KB</text><text x="770.0" y="359" class="ink2" font-size="11.5" text-anchor="start" font-weight="400">best detector, loses quiet species</text><text x="20" y="396" class="ink3" font-size="11.5" text-anchor="start" font-weight="400">Skippable silence: what a perfect detector skips behind the same gate, 7–33% of each hour depending on how much of it is birdsong. Only birdsong-free seconds count.</text><text x="20" y="414" class="ink3" font-size="11.5" text-anchor="start" font-weight="400">Birdsong missed: seconds of annotated song not written to the card. The threshold holds it near 2% overall; the worst recording is where arms differ.</text><text x="20" y="432" class="ink3" font-size="11.5" text-anchor="start" font-weight="400">Worst species: lowest retention among species with enough calls to measure. CNN: one training seed.</text></svg>