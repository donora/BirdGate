</style><rect class="bg" width="1000" height="446" rx="12"/><text x="20" y="34" class="ink" font-size="17" text-anchor="start" font-weight="600">The four approaches, same data, same gate</text><text x="980" y="34" class="ink2" font-size="13" text-anchor="end" font-weight="400">six held-out recordings, 98% of birdsong kept overall</text><rect class="accbg" x="20.0" y="52" width="226" height="322" rx="12" stroke-width="2"/><text x="36.0" y="82" class="ink" font-size="16" text-anchor="start" font-weight="600">MFCC + linear</text><text x="36.0" y="102" class="ink2" font-size="11.5" text-anchor="start" font-weight="400">FFT, mel filterbank, 20 MFCCs</text><text x="36.0" y="150" class="ink" font-size="34" text-anchor="start" font-weight="600">28%</text><text x="36.0" y="170" class="ink2" font-size="12" text-anchor="start" font-weight="400">of the skippable silence skipped</text><line class="line" x1="36.0" y1="196" x2="230.0" y2="196" stroke-width="1.5"/><line class="line" x1="36.0" y1="191" x2="36.0" y2="201" stroke-width="1"/><line class="line" x1="133.0" y1="191" x2="133.0" y2="201" stroke-width="1"/><line class="line" x1="230.0" y1="191" x2="230.0" y2="201" stroke-width="1"/><circle class="acc" cx="62.3" cy="196" r="4.5" opacity="0.85"/><circle class="acc" cx="84.2" cy="196" r="4.5" opacity="0.85"/><circle class="acc" cx="103.3" cy="196" r="4.5" opacity="0.85"/><circle class="acc" cx="82.3" cy="196" r="4.5" opacity="0.85"/><circle class="acc" cx="101.7" cy="196" r="4.5" opacity="0.85"/><circle class="acc" cx="83.6" cy="196" r="4.5" opacity="0.85"/><text x="36.0" y="216" class="ink3" font-size="11" text-anchor="start" font-weight="400">14–35% by recording</text><text x="230.0" y="216" class="ink3" font-size="11" text-anchor="end" font-weight="400">100%</text><text x="36.0" y="248" class="limitt" font-size="13" text-anchor="start" font-weight="600">1.7% of birdsong missed</text><text x="36.0" y="266" class="limitt" font-size="11.5" text-anchor="start" font-weight="400">