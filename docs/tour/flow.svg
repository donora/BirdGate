<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="BirdGate pipeline: microphone, features, tiny model, adaptive threshold, gate, SD card"><title>BirdGate pipeline: microphone, features, tiny model, adaptive threshold, gate, SD card</title>
<style>
