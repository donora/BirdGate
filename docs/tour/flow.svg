</style><rect class="bg" width="1000" height="250" rx="12"/><text x="20" y="34" class="ink" font-size="17" text-anchor="start" font-weight="600">One second of audio, every second</text><text x="980" y="34" class="ink2" font-size="13" text-anchor="end" font-weight="400">on a 48 MHz Cortex-M4F, 32 KB RAM</text><rect class="box" x="20" y="62" width="140" height="116" rx="10" stroke-width="1.5"/><text x="34" y="90" class="ink" font-size="15" text-anchor="start" font-weight="600">Microphone</text><text x="34" y="116" class="ink2" font-size="12.5" text-anchor="start" font-weight="400">32,000 samples/s,</text><text x="34" y="135" class="ink2" font-size="12.5" text-anchor="start" font-weight="400">a second at a time</text><text x="90.0" y="204" class="acct" font-size="12.5" text-anchor="middle" font-weight="600">4.1 KB sample buffer</text><line class="line" x1="166" y1="120.0" x2="176.0" y2="120.0" stroke-width="2"/><path class="ink3" d="M182.0 120.0 l-9 -5 v10 z"/><rect class="box" x="188.0" y="62" width="140" height="116" rx="10" stroke-width="1.5"/><text x="202.0" y="90" class="ink" font-size="15" text-anchor="start" font-weight="600">Features</text><text x="202.0" y="116" class="ink2" font-size="12.5" text-anchor="start" font-weight="400">FFT → mel → MFCCs,</text><text x="202.0" y="135" class="ink2" font-size="12.5" text-anchor="start" font-weight="400">40 numbers a second</text><text x="258.0" y="204" class="acct" font-size="12.5" text-anchor="middle" font-weight="600">2 KB spectrum</text><line class="line" x1="334.0" y1="120.0" x2="344.0" y2="120.0" stroke-width="2"/><path class="ink3" d="M350.0 120.0 l-9 -5 v10 z"/><rect class="accbg" x="356.0" y="62" width="140" height="116" rx="10" stroke-width="1.5"/><text x="370.0" y="90" class="ink" font-size="15" text-anchor="start" font-weight="600">Tiny model</text><text x="370.0" y="116" class="ink2" font-size="12.5" text-anchor="start" font-weight="400">40 weights + 1 bias</text><text x="370.0" y="135" class="ink2" font-size="12.5" text-anchor="start" font-weight="400">→ one score</text><text x="426.0" y="204" class="acct" font-size="12.5" text-anchor="middle" font-weight="600">164 bytes</text><line class="line" x1="502.0" y1="120.0" x2="512.0" y2="120.0" stroke-width="2"/><path class="ink3" d="M518.0 120.0 l-9 -5 v10 z"/><rect class="box" x="524.0" y="62" width="140" height="116" rx="10" stroke-width="1.5"/><text x="538.0" y="90" class="ink" font-size="15" text-anchor="start" font-weight="600">Threshold</text><text x="538.0" y="116" class="ink2" font-size="12.5" text-anchor="start" font-weight="400">score minus recent</text><text x="538.0" y="135" class="ink2" font-size="12.5" text-anchor="start" font-weight="400">background (CFAR)</text><text x="594.0" y="204" class="acct" font-size="12.5" text-anchor="middle" font-weight="600">2.4 KB of history</text><line class="line" x1="670.0" y1="120.0" x2="680.0" y2="120.0" stroke-width="2"/><path class="ink3" d="M686.0 120.0 l-9 -5 v10 z"/><rect class="box" x="692.0" y="62" width="140" height="116" rx="10" stroke-width="1.5"/><text x="706.0" y="90" class="ink" font-size="15" text-anchor="start" font-weight="600">Gate</text><text x="706.0" y="116" class="ink2" font-size="12.5" text-anchor="start" font-weight="400">pre-roll, hangover,</text><text x="706.0" y="135" class="ink2" font-size="12.5" text-anchor="start" font-weight="400">≥ 20 s per file</text><text x="762.0" y="204" class="acct" font-size="12.5" text-anchor="middle" font-weight="600">a few bytes of state</text><line class="line" x1="838.0" y1="120.0" x2="848.0" y2="120.0" stroke-width="2"/><path class="ink3" d="M854.0 120.0 l-9 -5 v10 z"/><rect class="accbg" x="860.0" y="62" width="120" height="52" rx="10" stroke-width="1.5"/><text x="920.0" y="84" class="ink" font-size="14" text-anchor="middle" font-weight="600">Bird?</text><text x="920.0" y="102" class="acct" font-size="12" text-anchor="middle" font-weight="600">write to SD card</text><rect class="box" x="860.0" y="126" width="120" height="52" rx="10" stroke-width="1.5"/><text x="920.0" y="148" class="ink" font-size="14" text-anchor="middle" font-weight="600">No bird?</text><text x="920.0" y="166" class="ink2" font-size="12" text-anchor="middle" font-weight="400">skip, write nothing</text><text x="20" y="234" class="ink2" font-size="12.5" text-anchor="start" font-weight="400">The model is the smallest part of the system. The threshold and the gate decide whether it can be trusted in the field.</text></svg>